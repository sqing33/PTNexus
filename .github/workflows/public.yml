name: 推送内容到仓库

on:
  # push:
  #   branches:
  #     - main
  #     - master
  workflow_dispatch: # 手动触发

jobs:
  filter-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: 检出私有仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 设置 Git
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"

      - name: 拉取 go/python 分支引用
        run: |
          set -euo pipefail
          git fetch origin \
            +refs/heads/go:refs/remotes/origin/go \
            +refs/heads/python:refs/remotes/origin/python

      - name: 安装 BFG 仓库清理工具
        run: |
          echo "📦 正在安装 BFG 仓库清理工具..."
          sudo apt-get update
          sudo apt-get install -y default-jre
          wget https://repo1.maven.org/maven2/com/madgag/bfg/1.14.0/bfg-1.14.0.jar -O /tmp/bfg.jar
          echo "✅ BFG 安装成功"

      - name: 创建用于过滤的临时克隆
        run: |
          echo "📋 正在创建临时克隆..."
          cd /tmp
          git clone --mirror "${GITHUB_WORKSPACE}/.git" repo-mirror.git
          cd repo-mirror.git
          cd /tmp/repo-mirror.git

          # 补齐镜像仓库的 refs/heads/go|python（checkout 可能只拉单分支，导致源 .git 缺少 heads ref）
          for BRANCH in go python; do
            if git show-ref --verify --quiet "refs/heads/${BRANCH}"; then
              continue
            fi
            if git show-ref --verify --quiet "refs/remotes/origin/${BRANCH}"; then
              git update-ref "refs/heads/${BRANCH}" "refs/remotes/origin/${BRANCH}"
              continue
            fi
            echo "❌ 缺少分支引用：${BRANCH}（未找到 refs/heads/${BRANCH} 或 refs/remotes/origin/${BRANCH}）"
            exit 1
          done

      - name: 使用 BFG 清理仓库历史
        run: |
          set -e
          cd /tmp/repo-mirror.git

          BFG_ARGS=()

          # 添加 --no-blob-protection 参数，清理所有提交包括 HEAD
          BFG_ARGS+=(--no-blob-protection)

          # 处理要删除的文件列表
          if [ -f "${GITHUB_WORKSPACE}/.bfg_delete_files" ]; then
            FILES_TO_DELETE=$(grep -vE '^#|^$' "${GITHUB_WORKSPACE}/.bfg_delete_files" | tr '\n' ',' | sed 's/,$//')
            if [ -n "$FILES_TO_DELETE" ]; then
              echo "🗑️  待删除文件: $FILES_TO_DELETE"
              BFG_ARGS+=(--delete-files "{$FILES_TO_DELETE}")
            fi
          fi

          # 处理要删除的文件夹列表
          if [ -f "${GITHUB_WORKSPACE}/.bfg_delete_folders" ]; then
            FOLDERS_TO_DELETE=$(grep -vE '^#|^$' "${GITHUB_WORKSPACE}/.bfg_delete_folders" | tr '\n' ',' | sed 's/,$//')
            if [ -n "$FOLDERS_TO_DELETE" ]; then
              echo "🗑️  待删除文件夹: $FOLDERS_TO_DELETE"
              BFG_ARGS+=(--delete-folders "{$FOLDERS_TO_DELETE}")
            fi
          fi

          # 检查除了 --no-blob-protection 之外是否还有其他清理参数
          if [ ${#BFG_ARGS[@]} -le 1 ]; then
            echo "⚠️  未指定要清理的文件或文件夹。"
          else
            echo "🧹 正在使用 BFG 清理仓库..."
            echo "执行参数: ${BFG_ARGS[@]}"
            java -jar /tmp/bfg.jar "${BFG_ARGS[@]}" .
            
            echo "📦 正在压缩仓库..."
            git reflog expire --expire=now --all
            git gc --prune=now --aggressive
          fi

          # 删除配置文件本身
          echo "🗑️  正在从历史记录中移除 BFG 配置文件..."
          java -jar /tmp/bfg.jar --no-blob-protection --delete-files "{.bfg_delete_files,.bfg_delete_folders}" .
          git reflog expire --expire=now --all
          git gc --prune=now --aggressive

      - name: 推送到 Github 仓库
        env:
          PUBLIC_REPO_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
          PUBLIC_REPO_URL: ${{ secrets.PUBLIC_REPO_URL }}
        run: |
          set -euo pipefail
          cd /tmp/repo-mirror.git

          # 自动过滤 https:// 或 http:// 前缀
          CLEAN_URL="${PUBLIC_REPO_URL}"
          CLEAN_URL="${CLEAN_URL#https://}"
          CLEAN_URL="${CLEAN_URL#http://}"
          REMOTE_URL="https://${PUBLIC_REPO_TOKEN}@${CLEAN_URL}"

          echo "🚀 正在将 DEV 仓库分支覆盖推送到 Github 仓库..."
          echo "目标地址: ${CLEAN_URL}"

          # 重置远程，避免重试时 remote 已存在
          git remote remove github 2>/dev/null || true
          git remote add github "${REMOTE_URL}"

          # 计划保留的分支（目标仓库只保留这些分支）
          RETAIN_BRANCHES=(go python)
          for BRANCH in "${RETAIN_BRANCHES[@]}"; do
            if ! git show-ref --verify --quiet "refs/heads/${BRANCH}"; then
              echo "❌ 缺少必需分支 ${BRANCH}（refs/heads/${BRANCH}）"
              exit 1
            fi
          done

          # 防呆：目标默认分支必须先切到 go，否则删除 main 会被拒绝
          DEFAULT_BRANCH="$(git ls-remote --symref "${REMOTE_URL}" HEAD | awk '/^ref:/ {sub("refs/heads/","",$2); print $2; exit}')"
          if [ "${DEFAULT_BRANCH}" != "go" ]; then
            echo "❌ 目标仓库默认分支为 ${DEFAULT_BRANCH}，请先改为 go 后重试"
            exit 1
          fi

          # 覆盖同步分支，不推送 tags
          PUSH_ARGS=()
          for BRANCH in "${RETAIN_BRANCHES[@]}"; do
            PUSH_ARGS+=("+refs/heads/${BRANCH}:refs/heads/${BRANCH}")
          done
          git push github "${PUSH_ARGS[@]}"

          # 清理目标仓库其余分支，仅保留 go 与 python
          git ls-remote --heads "${REMOTE_URL}" | awk '{print $2}' | sed 's#refs/heads/##' | while read -r BRANCH; do
            KEEP_BRANCH=0
            for RETAIN in "${RETAIN_BRANCHES[@]}"; do
              if [ "${BRANCH}" = "${RETAIN}" ]; then
                KEEP_BRANCH=1
                break
              fi
            done
            if [ "${KEEP_BRANCH}" -eq 0 ]; then
              git push github --delete "${BRANCH}"
            fi
          done

          echo "✅ 已完成分支覆盖同步：目标仅保留 go / python，tags 不变"

      - name: 清理工作
        if: always()
        run: |
          rm -rf /tmp/repo-mirror.git /tmp/bfg.jar
          echo "🧹 清理完成"
