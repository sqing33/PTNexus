name: 手动构建桌面端 Windows 安装包

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-desktop-windows:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 检出代码
        uses: actions/checkout@v4

      - name: 2. 设置 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: desktop/go.mod

      - name: 3. 设置 Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: webui/pnpm-lock.yaml

      - name: 4. 设置 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: 5. 安装构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y nsis p7zip-full unzip

      - name: 6. 安装 Wails CLI
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.11.0
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: 7. 下载 Windows 媒体工具（mpv / ffmpeg / ffprobe / mediainfo）
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TOOLS_DIR="desktop/tools/windows"
          TMP_DIR="$(mktemp -d)"
          mkdir -p "$TOOLS_DIR"
          rm -rf "$TOOLS_DIR"/*

          python3 - <<'PY' "$TMP_DIR" "$TOOLS_DIR"
          import json
          import os
          import pathlib
          import subprocess
          import sys
          import urllib.request

          tmp_dir = pathlib.Path(sys.argv[1])
          tools_dir = pathlib.Path(sys.argv[2])

          def fetch_json(url: str):
            headers = {"User-Agent": "ptnexus-ci"}
            gh_token = os.environ.get("GITHUB_TOKEN", "").strip()
            if gh_token:
              headers["Authorization"] = f"Bearer {gh_token}"
            req = urllib.request.Request(url, headers=headers)
            with urllib.request.urlopen(req, timeout=30) as resp:
              return json.load(resp)

          def download(url: str, out: pathlib.Path):
            out.parent.mkdir(parents=True, exist_ok=True)
            subprocess.run(["curl", "-fsSL", "-o", str(out), url], check=True)

          ff_rel = fetch_json("https://api.github.com/repos/BtbN/FFmpeg-Builds/releases/latest")
          ff_asset = next(
            a for a in ff_rel["assets"]
            if a["name"] == "ffmpeg-master-latest-win64-gpl.zip"
          )
          ff_zip = tmp_dir / ff_asset["name"]
          download(ff_asset["browser_download_url"], ff_zip)
          subprocess.run(["unzip", "-q", "-o", str(ff_zip), "-d", str(tmp_dir / "ffmpeg")], check=True)

          ffmpeg_exe = next((tmp_dir / "ffmpeg").rglob("ffmpeg.exe"))
          ffprobe_exe = next((tmp_dir / "ffmpeg").rglob("ffprobe.exe"))
          (tools_dir / "ffmpeg.exe").write_bytes(ffmpeg_exe.read_bytes())
          (tools_dir / "ffprobe.exe").write_bytes(ffprobe_exe.read_bytes())

          mpv_rel = fetch_json("https://api.github.com/repos/shinchiro/mpv-winbuild-cmake/releases/latest")
          mpv_asset = next(
            a for a in mpv_rel["assets"]
            if a["name"].startswith("mpv-x86_64-") and a["name"].endswith(".7z")
          )
          mpv_7z = tmp_dir / mpv_asset["name"]
          download(mpv_asset["browser_download_url"], mpv_7z)
          subprocess.run(["7z", "x", "-y", str(mpv_7z), f"-o{tmp_dir / 'mpv'}"], check=True)

          mpv_exe = next((tmp_dir / "mpv").rglob("mpv.exe"))
          mpv_root = mpv_exe.parent
          for item in mpv_root.iterdir():
            target = tools_dir / item.name
            if item.is_dir():
              if target.exists():
                subprocess.run(["rm", "-rf", str(target)], check=True)
              subprocess.run(["cp", "-a", str(item), str(target)], check=True)
            else:
              target.write_bytes(item.read_bytes())

          media_rel = fetch_json("https://api.github.com/repos/MediaArea/MediaInfo/releases/latest")
          media_version = str(media_rel.get("tag_name", "")).strip().lstrip("v")
          if not media_version:
            raise RuntimeError("无法解析 MediaInfo 最新版本号(tag_name)")

          media_zip = tmp_dir / f"MediaInfo_CLI_{media_version}_Windows_x64.zip"
          media_urls = [
            f"https://mediaarea.net/download/binary/mediainfo/{media_version}/MediaInfo_CLI_{media_version}_Windows_x64.zip",
            f"https://mediaarea.net/download/binary/mediainfo/{media_version}/MediaInfo_CLI_{media_version}_Windows_x64_WithoutInstaller.zip",
          ]
          downloaded = False
          for media_url in media_urls:
            try:
              download(media_url, media_zip)
              downloaded = True
              break
            except subprocess.CalledProcessError:
              continue
          if not downloaded:
            raise RuntimeError(f"下载 MediaInfo 失败，尝试地址: {media_urls}")

          subprocess.run(["unzip", "-q", "-o", str(media_zip), "-d", str(tmp_dir / "mediainfo")], check=True)

          media_exe = next(
            p for p in (tmp_dir / "mediainfo").rglob("*")
            if p.is_file() and p.name.lower() == "mediainfo.exe"
          )
          media_root = media_exe.parent
          for item in media_root.iterdir():
            target = tools_dir / item.name
            if item.is_dir():
              if target.exists():
                subprocess.run(["rm", "-rf", str(target)], check=True)
              subprocess.run(["cp", "-a", str(item), str(target)], check=True)
            else:
              target.write_bytes(item.read_bytes())

          media_upper = tools_dir / "MediaInfo.exe"
          media_lower = tools_dir / "mediainfo.exe"
          if media_upper.exists():
            if media_lower.exists():
              media_lower.unlink()
            media_upper.rename(media_lower)
          PY

          ls -lah "$TOOLS_DIR"

      - name: 8. 构建桌面端安装包
        run: |
          bash scripts/package-desktop.sh

      - name: 9. 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-package
          path: |
            desktop/build/bin/pt-nexus.exe
            desktop/build/bin/pt-nexus-*-amd64-installer.exe
          if-no-files-found: error
