# HDVideo站点的配置文件
# 基于三层解耦模型重构，包含source_parsers和标准化的mappings

site_name: "HDVideo"

# 表单字段定义 - 定义站点上传表单中各字段的标识符
form_fields:
  category: "type"
  medium: "medium_sel[4]"
  video_codec: "codec_sel[4]"
  audio_codec: "audiocodec_sel[4]"
  resolution: "standard_sel[4]"
  team: "team_sel[4]"
  region: "region_sel[4]"
  tags[]: "tags[4][]"

# 标准化键映射 - 定义源文本到标准化键的映射规则
# source_parsers部分：定义如何从原始数据解析出标准化参数
source_parsers:
  source_params:
    type:
      source_key: "类型"
    medium:
      source_key: "媒介"
    video_codec:
      source_key: "编码"
    audio_codec:
      source_key: "音频编码"
    resolution:
      source_key: "分辨率"
    team:
      source_key: "制作组"

  # 标准化键映射规则（从原始文本到标准化键）
  standard_keys:
    type:
      "电影": "category.movie"
      "电视剧": "category.tv_series"
      "动漫": "category.animation"
      "综艺": "category.tv_shows"
      "纪录片": "category.documentaries"
      "体育": "category.sports"
      "音乐MV": "category.mv"
      "音轨": "category.music"

    medium:
      "WEB-DL": "medium.webdl"
      "UHDTV/HDTV": "medium.hdtv"
      "UHD Blu-ray": "medium.uhd_bluray"
      "FHD Blu-ray": "medium.bluray"
      "Encode": "medium.encode"
      "Remux": "medium.remux"
      "DVD": "medium.dvd"
      "CD": "medium.cd"
      "Other": "medium.other"

    video_codec:
      "ProRes": "video.prores"
      "AV1/S": "video.av1"
      "VP8/9": "video.vp9"
      "VC-1": "video.vc1"
      "MPEG-2": "video.mpeg2"
      "AVC/H.264/x264": "video.h264"
      "HEVC/H.265/x265": "video.h265"
