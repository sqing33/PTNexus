# HDClone站点配置文件
# NexusPHP标准站点，无音频编码字段

site_name: "HDClone"

form_fields:
  category: "type"
  medium: "medium_sel[4]"
  video_codec: "codec_sel[4]"
  resolution: "standard_sel[4]"
  tags[4][]: "tags[]"

source_parsers:
  source_params:
    type:
      source_key: "类型"
    medium:
      source_key: "质量媒介"
    video_codec:
      source_key: "编码"
    resolution:
      source_key: "分辨率"
    tags[]:
      source_key: "标签"

  standard_keys:
    type:
      "Movies/电影": "category.movie"
      "TV Series/电视剧": "category.tv_series"
      "TV Shows/综艺": "category.tv_shows"
      "Documentaries/纪录片": "category.documentaries"
      "Animations/动漫、动画": "category.animation"
      "Playlet/短剧": "category.playlet"
      "MV/演唱会": "category.mv"
      "Music/音乐": "category.music"
      "Othes/其他": "category.other"

    medium:
      "UHD Blu-ray": "medium.uhd_bluray"
      "Blu-ray": "medium.bluray"
      "Remux": "medium.remux"
      "Encode": "medium.encode"
      "WEB-DL": "medium.webdl"
      "MiniBD": "medium.minibd"
      "DVD": "medium.dvd"
      "CD": "medium.cd"
      "HDTV": "medium.hdtv"
      "Track": "medium.track"

    video_codec:
      "H.264/x264/AVC": "video.h264"
      "H265/HEVC/x265": "video.h265"
      "VC-1": "video.vc1"
      "AV1": "video.av1"
      "MPEG-2": "video.mpeg2"
      "Other": "video.other"

    resolution:
      "4320p/8K": "resolution.r4320p"
      "2160p/4K": "resolution.r2160p"
      "1080p/1080i": "resolution.r1080p"
      "720p": "resolution.r720p"
      "SD/720p以下": "resolution.sd"
      "Othes（慎选）": "resolution.other"

    tag:
      "禁转": "tag.禁转"
      "DIY": "tag.DIY"
      "国语": "tag.国语"
      "中字": "tag.中字"
      "HDR": "tag.HDR"

mappings:
  type:
    "category.movie": "401"
    "category.tv_series": "402"
    "category.tv_shows": "403"
    "category.documentaries": "404"
    "category.animation": "405"
    "category.mv": "410"
    "category.music": "408"
    "category.other": "407"
    "default": "401"

  medium:
    "medium.uhd_bluray": "9"
    "medium.bluray": "1"
    "medium.remux": "3"
    "medium.encode": "7"
    "medium.webdl": "6"
    "medium.minibd": "4"
    "medium.dvd": "10"
    "medium.cd": "8"
    "medium.hdtv": "2"
    "medium.track": "5"
    "default": "7"

  video_codec:
    "video.h264": "1"
    "video.h265": "6"
    "video.vc1": "2"
    "video.av1": "3"
    "video.mpeg2": "4"
    "video.other": "5"
    "default": "5"

  resolution:
    "resolution.r4320p": "6"
    "resolution.r2160p": "1"
    "resolution.r1080p": "2"
    "resolution.r720p": "3"
    "resolution.sd": "4"
    "resolution.other": "5"
    "default": "5"

  tag:
    "tag.禁转": 1
    "tag.DIY": 4
    "tag.国语": 5
    "tag.中字": 6
    "tag.HDR": 7
    "default": null
