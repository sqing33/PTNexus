site_name: "HDFans"

# HDFans 上传页关键字段（upload.php）
form_fields:
  category: "type"
  medium: "medium_sel[4]"
  video_codec: "codec_sel[4]"
  audio_codec: "audiocodec_sel[4]"
  resolution: "standard_sel[4]"
  source: "processing_sel[4]"
  team: "team_sel[4]"

source_parsers:
  # 仅在 standardized_params 缺失时回退使用；正常迁移发布优先使用 migrator/ParameterMapper 的 standardized_params
  source_params:
    type:
      source_key: "类型"
    medium:
      source_key: "媒介"
    video_codec:
      source_key: "视频编码"
    audio_codec:
      source_key: "音频编码"
    resolution:
      source_key: "分辨率"
    team:
      source_key: "制作组"
    source:
      source_key: "产地"

  standard_keys:
    # 类型（仅回退流程使用）
    type:
      "Movies/电影": "category.movie"
      "TV Series/电视剧": "category.tv_series"
      "Documentaries/纪录片": "category.documentaries"
      "Music/音乐": "category.music"
      "TV Shows/综艺": "category.tv_shows"
      "Animations/动漫、动画": "category.animation"
      "Music Videos/音乐视频": "category.mv"
      "Concert/演唱会": "category.stage"
      "Education/教育": "category.study"
      "Audio Books/有声读物": "category.audiobook"
      "Drama/戏剧": "category.drama"
      "Sports/体育": "category.sports"
      "Software/软件": "category.software"
      "Games/游戏": "category.game"
      "E-Books/电子书": "category.ebook"
      "Others/其他": "category.other"

    # 媒介（仅回退流程使用；发布时仅对原盘按 DIY 做 17/18、21/22 的区分，其余媒介沿用 mappings.medium 默认映射）
    medium:
      "UHD原盘": "medium.uhd_bluray"
      "UHD DIY": "medium.uhd_bluray"
      "UHD Remux": "medium.remux"
      "UHD压制": "medium.encode_2160p"
      "BD原盘": "medium.bluray"
      "BD DIY": "medium.bluray"
      "BD Remux": "medium.remux"
      "1080P/i压制": "medium.encode_1080p"
      "720P压制": "medium.encode_720p"
      "MiniSD": "medium.minisd"
      "WEB-DL": "medium.webdl"
      "HDTV": "medium.hdtv"
      "DVD": "medium.dvd"
      "CD": "medium.cd"
      "SACD": "medium.sacd"
      "CD+VCD": "medium.cd_vcd"
      "CD+DVD": "medium.cd_dvd"
      "黑胶": "medium.vinyl"
      "Other": "medium.other"

