root = "."
# 跨平台：使用 server 目录下的 tmp/，避免 Linux /tmp 在 Windows 不存在
tmp_dir = "tmp/ptnexus-air"

[build]
cmd = "go build -o tmp/ptnexus-server.air.exe ./cmd/server"
bin = "tmp/ptnexus-server.air.exe"
full_bin = "tmp/ptnexus-server.air.exe"
include_ext = ["go", "yaml", "yml", "json"]
exclude_dir = ["data", "docs", "tmp", ".git", "bdinfo"]
exclude_regex = ["_test\\.go"]
delay = 800
stop_on_error = true
send_interrupt = true
kill_delay = "300ms"

[log]
time = true

[misc]
clean_on_exit = true
